<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SEAvtomat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-title"><hr>SE_Avtomat<hr></div>

    <div class="switches-container">
        <div class="switch">
            <input type="checkbox" id="toggle-switch-left">
            <label for="toggle-switch-left"><i></i></label>
        </div>
        <div class="switch">
            <input type="checkbox" id="toggle-switch-right">
            <label for="toggle-switch-right"><i></i></label>
        </div>
    </div>

    <div class="switch-demo4">
        <input type="checkbox" id="power-button">
        <label for="power-button"><i class="fa fa-power-off"></i></label>
    </div>

    <div class="bottom-nav">
        <a href="#home" class="nav-item">
            <i class="fas fa-house"></i>
            Home
        </a>
        <a href="#search" class="nav-item">
            <i class="fas fa-magnifying-glass"></i>
            Search
        </a>
        <a href="#add" class="nav-item">
            <i class="fas fa-plus"></i>
            Add
        </a>
        <a href="#notifications" class="nav-item">
            <i class="fas fa-bell"></i>
            Alerts
        </a>
        <a href="#profile" class="nav-item">
            <i class="fas fa-user"></i>
            Profile
        </a>
    </div>

    <script type="module" src="sidepanel.js"></script>
</body>
</html>
